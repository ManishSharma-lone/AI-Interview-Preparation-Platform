services:
  - type: web
    name: ai-interview-platform
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: AI_PROVIDER
        value: mock
      - key: SECRET_KEY
        value: change-this-to-a-random-secret
