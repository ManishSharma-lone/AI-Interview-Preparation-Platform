services:
  - type: web
    name: ai-interview-platform
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python start.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: AI_PROVIDER
        value: mock
      - key: SECRET_KEY
        generateValue: true

